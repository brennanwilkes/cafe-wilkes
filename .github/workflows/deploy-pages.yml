name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/deploy-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Pages serves everything with max-age=600, so bust browser caches by stamping the commit onto asset URLs.
      - name: Stamp build id
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" frontend/index.html frontend/*.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
